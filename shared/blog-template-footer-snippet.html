<script>
/* ==========================================================================
   BRIGHTBOX DIGITAL - REUSABLE BLOG ARTICLE SCRIPT
   Version 1.2, 2026-07-19

   Goes in the site footer ONCE, not per article. Does nothing on pages with
   no article wrapper.

   NO ANGLE BRACKETS IN COMMENTS. See blog-template.css for why.

   DESIGN RULE, do not change this:
   The stylesheet shows all content by default. This script adds the class
   bbx-post-jsready to the wrapper, which is what switches the reveal
   animation on. If this script fails to run, or runs before a page builder
   has injected the article, the article is still completely readable. It
   just does not animate.

   Version 1.1 had this backwards and an article rendered blank when the
   script did not run. Never make visibility depend on this file.

   It also handles page builders that inject content after page load, by
   retrying on DOMContentLoaded and again on a short delayed pass.
   ========================================================================== */
(function () {
  'use strict';

  var initialised = false;

  function init() {
    var root = document.querySelector('.bbx-post');
    if (!root || initialised) return;
    initialised = true;

    var reduceMotion = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var revealEls = root.querySelectorAll('.bbx-post-reveal');
    var canObserve = 'IntersectionObserver' in window;

    /* Only opt into the animation when we can actually finish the job.
       Without this class the stylesheet leaves everything visible. */
    if (canObserve && !reduceMotion && revealEls.length) {
      root.classList.add('bbx-post-jsready');

      var revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('bbx-post-inview');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

      Array.prototype.forEach.call(revealEls, function (el) {
        revealObserver.observe(el);
      });

      /* Safety net. If anything is still hidden after 2.5 seconds, show it.
         Covers observers that never fire inside odd stacking or transform
         contexts that some page builders create. */
      window.setTimeout(function () {
        Array.prototype.forEach.call(revealEls, function (el) {
          el.classList.add('bbx-post-inview');
        });
      }, 2500);
    }

    /* ---- Table of contents accordion ---- */
    var tocToggle = root.querySelector('.bbx-post-tocHead');
    var tocPanel = root.querySelector('.bbx-post-tocPanel');
    if (tocToggle && tocPanel) {
      tocToggle.addEventListener('click', function () {
        var open = tocToggle.getAttribute('aria-expanded') === 'true';
        tocToggle.setAttribute('aria-expanded', String(!open));
        tocPanel.classList.toggle('bbx-post-tocOpen');
      });
    }

    /* ---- Active section tracking and smooth scroll ---- */
    var tocLinks = Array.prototype.slice.call(
      root.querySelectorAll('.bbx-post-tocList a')
    );
    var tracked = [];
    tocLinks.forEach(function (link) {
      var id = (link.getAttribute('href') || '').replace('#', '');
      var target = id ? document.getElementById(id) : null;
      if (target) tracked.push({ link: link, el: target });
    });

    function setActive(link) {
      tocLinks.forEach(function (l) { l.classList.remove('bbx-post-tocActive'); });
      link.classList.add('bbx-post-tocActive');
    }

    if (tracked.length && canObserve) {
      var headingObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var match = tracked.filter(function (s) { return s.el === entry.target; })[0];
            if (match) setActive(match.link);
          }
        });
      }, { rootMargin: '-15% 0px -65% 0px' });
      tracked.forEach(function (s) { headingObserver.observe(s.el); });
      setActive(tracked[0].link);
    }

    tocLinks.forEach(function (link) {
      link.addEventListener('click', function (e) {
        var id = (link.getAttribute('href') || '').replace('#', '');
        var target = id ? document.getElementById(id) : null;
        if (target) {
          e.preventDefault();
          var offsetTop = target.getBoundingClientRect().top + window.pageYOffset - 90;
          window.scrollTo({
            top: offsetTop,
            behavior: reduceMotion ? 'auto' : 'smooth'
          });
        }
      });
    });
  }

  /* Run now if the article is already in the DOM, otherwise wait.
     The delayed pass covers page builders that inject content late. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  window.setTimeout(init, 400);
  window.addEventListener('load', init);
})();
</script>
