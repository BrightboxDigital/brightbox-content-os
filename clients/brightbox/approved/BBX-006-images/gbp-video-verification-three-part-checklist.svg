<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">Three-part Google Business Profile video verification checklist</title>
  <desc id="desc">Checklist covering location, business operations, and management proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08152f"/>
      <stop offset="0.55" stop-color="#24134a"/>
      <stop offset="1" stop-color="#5c2599"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffab24"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#030817" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1536" height="864" fill="#08152f"/>
  <circle cx="1430" cy="90" r="220" fill="#7a3fc0" opacity="0.18"/>
  <circle cx="120" cy="820" r="250" fill="#005f92" opacity="0.18"/>
  <rect x="88" y="74" width="1360" height="716" rx="42" fill="#0c1833" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="88" y="74" width="1360" height="14" rx="7" fill="#ffab24"/>
  <text x="144" y="155" fill="#ffbf4d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">SERVICE BUSINESS CHECKLIST</text>
  <text x="144" y="220" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">Video verification needs three kinds of proof</text>
  <text x="144" y="267" fill="#c9d4ed" font-family="Arial, Helvetica, sans-serif" font-size="25">Make each one easy to see in one continuous recording.</text>

  <g filter="url(#shadow)">
    <rect x="130" y="330" width="392" height="380" rx="30" fill="#ffffff"/>
    <circle cx="196" cy="397" r="34" fill="#5c2599"/>
    <text x="196" y="407" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">1</text>
    <path d="M316 372c-49 0-88 39-88 88 0 66 88 151 88 151s88-85 88-151c0-49-39-88-88-88zm0 122a35 35 0 1 1 0-70 35 35 0 0 1 0 70z" fill="#ffab24" opacity="0.95" transform="translate(98 150) scale(0.7 0.6)"/>
    <text x="326" y="560" text-anchor="middle" fill="#121b34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">SHOW THE LOCATION</text>
    <text x="326" y="605" text-anchor="middle" fill="#4e5870" font-family="Arial, Helvetica, sans-serif" font-size="21">Street sign, landmark,</text>
    <text x="326" y="637" text-anchor="middle" fill="#4e5870" font-family="Arial, Helvetica, sans-serif" font-size="21">or building number</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="572" y="330" width="392" height="380" rx="30" fill="#ffffff"/>
    <circle cx="638" cy="397" r="34" fill="#5c2599"/>
    <text x="638" y="407" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">2</text>
    <path d="M704 427h123l32 49v84H683v-89l21-44zm25 22-13 32h116l-19-32h-84zm-12 66a27 27 0 1 0 0 54 27 27 0 0 0 0-54zm108 0a27 27 0 1 0 0 54 27 27 0 0 0 0-54z" fill="#2b78b8" transform="translate(216 100) scale(0.7)"/>
    <text x="768" y="560" text-anchor="middle" fill="#121b34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">SHOW THE BUSINESS</text>
    <text x="768" y="605" text-anchor="middle" fill="#4e5870" font-family="Arial, Helvetica, sans-serif" font-size="21">Tools, equipment, products,</text>
    <text x="768" y="637" text-anchor="middle" fill="#4e5870" font-family="Arial, Helvetica, sans-serif" font-size="21">or branded materials</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1014" y="330" width="392" height="380" rx="30" fill="#ffffff"/>
    <circle cx="1080" cy="397" r="34" fill="#5c2599"/>
    <text x="1080" y="407" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">3</text>
    <circle cx="1190" cy="430" r="34" fill="none" stroke="#ffab24" stroke-width="18"/>
    <path d="M1215 452l50 50-14 14-10-10-10 10-16-16 10-10-28-28z" fill="#ffab24"/>
    <text x="1210" y="560" text-anchor="middle" fill="#121b34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">SHOW YOU MANAGE IT</text>
    <text x="1210" y="605" text-anchor="middle" fill="#4e5870" font-family="Arial, Helvetica, sans-serif" font-size="21">Unlock a business-only asset</text>
    <text x="1210" y="637" text-anchor="middle" fill="#4e5870" font-family="Arial, Helvetica, sans-serif" font-size="21">or show matching documents</text>
  </g>

  <text x="768" y="755" text-anchor="middle" fill="#dce5f7" font-family="Arial, Helvetica, sans-serif" font-size="22">Plan first. Protect private information. Show the proof clearly.</text>
</svg>
